<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>INKURIMENT — 参考画像プロトタイプ</title>
<!--
  【これは実験用のプロトタイプです】
  src/ を一切読み込みません。localStorage も触りません。
-->
<link rel="stylesheet" href="/proto/proto.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="row">
      <span class="k">敵</span><b id="hEn">0</b>
      <span class="k">fps</span><b id="hFps">—</b>
      <span class="k">◈</span><b id="hCoin">0</b>
      <span class="k">撃破</span><b id="hKill">0</b>
      <span id="hBuild" class="ver">—</span>
    </div>
  </div>

  <!-- 置く場所を選んでいる最中の案内。画面の邪魔をしないよう1行だけ -->
  <div id="banner"><span id="bannerTxt"></span><button id="bannerCancel">やめる</button></div>

  <!-- 選択中のユニットの調整。**バーで直感的に** -->
  <div id="adjust">
    <div class="ahead"><b id="aName">—</b><span id="aInfo"></span></div>
    <label class="bar">
      <span>向き</span>
      <input id="bFace" type="range" min="0" max="360" step="1" value="270">
      <i id="vFace">270°</i>
    </label>
    <label class="bar">
      <span>射界</span>
      <input id="bArc" type="range" min="0" max="100" step="1" value="50">
      <i id="vArc">50°</i>
    </label>
    <div class="arow">
      <button id="aMove">配置を変える</button>
      <button id="aRemove">撤去</button>
      <button id="aClose">閉じる</button>
    </div>
  </div>

  <div id="tools">
    <div class="grp">
      <span class="lbl">武器</span>
      <button class="w" data-w="gatling">ガトリング</button>
      <button class="w" data-w="sniper">スナイパー</button>
      <button class="w" data-w="cryo">凍結</button>
      <button id="clear">全撤去</button>
    </div>
    <div class="grp">
      <span class="lbl">敵数</span>
      <button class="n" data-n="200">200</button>
      <button class="n on" data-n="400">400</button>
      <button class="n" data-n="600">600</button>
      <button class="n" data-n="1000">1000</button>
      <button class="n" data-n="2000">2000</button>
    </div>
    <div class="grp">
      <span class="lbl">密集</span>
      <button class="m" data-m="none">なし</button>
      <button class="m" data-m="density">密度</button>
      <button class="m on" data-m="bucket">バケット</button>
      <button class="m" data-m="both">併用</button>
    </div>
    <div class="grp">
      <span class="lbl">地形</span>
      <button class="f on" data-f="small">標準</button>
      <button class="f" data-f="wide">広大</button>
      <span class="lbl">速さ</span>
      <button class="s" data-s="0.5">×0.5</button>
      <button class="s on" data-s="1">×1</button>
      <button class="s" data-s="2">×2</button>
      <button id="fx" class="on">演出</button>
      <button id="panel">▼</button>
    </div>
  </div>

  <div id="hint">武器を選ぶと、置ける場所（壁の上）が光ります</div>
</div>
<script src="/proto/proto.js"></script>
</body>
</html>
