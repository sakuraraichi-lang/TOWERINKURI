<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a10">
<meta name="description" content="インクリメンタル × ローグライト × タワーディフェンス × カード構築">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INKURIMENT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ ホーム ============ -->
  <!-- **1画面にいっぺんに詰め込まない。** ここはステージを選んで始めるだけ -->
  <div id="home">
    <div class="hbar">
      <div class="hcoin">◈ <b id="homeCoin">0</b></div>
      <div class="hprog" id="homeProg"></div>
    </div>

    <div id="homeMain">
      <button class="snav" id="homePrev" aria-label="前のステージ">◀</button>
      <div class="scard">
        <div class="slabel" id="homeLabel">ステージ 1</div>
        <div class="sname" id="homeName">—</div>
        <div class="sdesc" id="homeDesc"></div>
        <div class="smini" id="homeMini"></div>
        <div class="sstat" id="homeStat"></div>
      </div>
      <button class="snav" id="homeNext" aria-label="次のステージ">▶</button>
    </div>

    <button id="homeStart" class="bigstart">スタート</button>

    <!-- タブの中身。ホームにいるときだけ出る -->
    <div id="panel"></div>
  </div>

  <!-- ============ 戦場 ============ -->
  <div id="stage">
    <canvas id="cv"></canvas>

    <!-- 選んだ武器の調整。**盤面の武器のすぐ横に出す。**
         画面下のトレイに出すと、どの武器を触っているのか分からなかった -->
    <div id="upop"></div>

    <!-- **戦闘中に常時見えるのは、ここだけ。** -->
    <div id="hud">
      <div class="htop">
        <div class="hphase" id="hudPhase">準備フェーズ</div>
        <div class="hlife"><i id="hudHpBar"></i><span id="hudHp"></span></div>
      </div>
      <div id="toast"></div>
      <div id="tray"></div>
      <div class="hbtm">
        <button id="btnHome" class="ctl sq" title="ホームへ戻る">✕</button>
        <div class="hwave" id="hudWaveTxt"></div>
        <button id="btnSpeed" class="ctl sq">×1</button>
        <button id="btnPause" class="ctl sq">❙❙</button>
      </div>
      <!-- 準備完了。**誤爆しないよう、盤面から離れた右下に単独で置く** -->
      <button id="btnStart" class="readybtn">準備完了</button>
    </div>
  </div>

  <!-- ============ 下部タブ（ホームのときだけ） ============ -->
  <div id="tabs">
    <button data-tab="skill">スキル</button>
    <button data-tab="load">装備</button>
    <button data-tab="pack">パック<span id="badgePack" class="badge">0</span></button>
    <button data-tab="deck">デッキ</button>
    <button data-tab="coll">コレクション</button>
    <button data-tab="pres">転生</button>
  </div>

</div>

<div id="modal"></div>

<!-- 実験用プロトタイプへの入口。**ゲームの処理には一切関わりません。**
     参考画像の戦闘を試すための別ページで、セーブも共有しません -->
<a id="protoLink" href="/proto">試作を見る ▸</a>

<script src="src/util.js"></script>
<script src="src/balance.js"></script>
<script src="src/stages.js"></script>
<script src="src/weapons.js"></script>
<script src="src/cards.js"></script>
<script src="src/skilltree.js"></script>
<script src="src/packs.js"></script>
<script src="src/state.js"></script>
<script src="src/draft.js"></script>
<script src="src/combat.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
