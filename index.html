<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a10">
<meta name="description" content="インクリメンタル × ローグライト × タワーディフェンス × カード構築">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INKURIMENT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ ホーム ============ -->
  <!-- **1画面にいっぺんに詰め込まない。** ここはステージを選んで始めるだけ -->
  <div id="home">
    <div class="hbar">
      <!-- **タブを開いているときだけ出る「ホームへ戻る」。**
           左上の RANK と「指揮官」は、いまのところ何も伝えていない空き地なので、
           そこに重ねる（ユーザー 2026-09-22：
           「ホームへ戻るボタンを現在意味のない指揮官とランクを示している
             左上のデッドスペースに設置してください」） -->
      <button id="btnPanelBack" class="pbackbtn" title="ホームへ戻る">◀ ホーム</button>
      <div class="lvring"><b id="homeRank">0</b><i>RANK</i></div>
      <div class="hid">
        <div class="hnm" id="homeName2">指揮官</div>
        <div class="hxp"><i id="homeXp"></i></div>
        <div class="hnum" id="homeProg"></div>
      </div>
      <span id="build"></span>
      <button id="btnCfg" class="cfgbtn" title="設定"></button>
      <div class="hpill"><s id="homeCoinIc"></s><b id="homeCoin">0</b></div>
    </div>
    <!-- 版の説明。**「ver とは何か」が分からないと表示の意味が無い**ので、タップで出す -->
    <div id="buildNote"></div>
    <!-- 設定。歯車で開く -->
    <div id="cfgBox"></div>

    <!-- ホームの背景（動く六角の格子・走査線・光の粒）と、ロゴ。2026-09-24 デザインの作り直し -->
    <div id="homeFx"><i class="hfx-grid"></i><i class="hfx-glow"></i><i class="hfx-scan"></i><b class="hfx-dust"></b></div>
    <div class="hlogo"><span class="hlogo-mark" id="homeLogo"></span><span class="hlogo-word">INKURIMENT</span></div>
    <div id="homeMain">
      <button class="snav" id="homePrev" aria-label="前のステージ">◀</button>
      <div class="scard">
        <div class="heroart" id="homeMini"></div>
        <div class="htitle" id="homeName">—</div>
        <div class="hrule"><i>◆</i></div>
        <div class="hstageline" id="homeLabel">ステージ <b>1</b></div>
        <div class="hclear" id="homeStat"></div>
      </div>
      <button class="snav" id="homeNext" aria-label="次のステージ">▶</button>
    </div>

    <div class="startrow">
      <button id="homeStart" class="bigstart">出撃<s>▶</s></button>
      <!-- スキップ。**何も失わない。**解放条件を満たしたステージにだけ出る -->
      <button id="homeSkip" class="skipbtn">スキップ</button>
      <!-- 一括突破（転生3回から）。飛ばせる章をまとめて通過する -->
      <button id="homeSkipAll" class="skipbtn"></button>
    </div>

    <!-- タブの中身。ホームにいるときだけ出る -->
    <div id="panel"></div>
  </div>

  <!-- ============ 戦場 ============ -->
  <!-- 4つの領域に分ける。**どれも重ならない。**
       盤面の上にボタンを浮かせていたせいで、
       置きたいところにユニット選択ボタンが被って置けないことがあった -->
  <div id="stage">
    <!-- 2026-09-26 作り直し（ユーザー「もう少し洗練しつつ、見やすさとかっこよさを重視しましょう」）
         上の帯（準備フェーズの表示・HPバー）は外した。HPはコアの周りの緑の輪で見える。
         準備フェーズとウェーブの番号はカットイン（#cutin）で出す。
         ホームへ戻る・一時停止・音は ⚙ のポップアップ（#bcfg）にまとめ、開いている間は止める。
         左にあった武器の列は下の1列に移した：［⚙］［倍速］［武器…］［準備完了］ -->
    <div class="bfield">
      <canvas id="cv"></canvas>
      <!-- 盤の左上に小さく重ねる：火力の内訳と、ウェーブの残り -->
      <div class="bhud">
        <button id="btnDmg" class="hdmg" title="武器ごとの火力">火力</button>
        <span id="hudLeft" class="hleft"></span>
        <div id="perf"></div>
      </div>
      <div id="upop"></div>
      <div id="dmgpop"></div>
      <div id="zoneTip"></div>
      <div id="cutin"></div>
      <div id="toast"></div>
      <div id="tut"></div>
      <div id="bcfg"></div>
    </div>

    <!-- 下：1列 -->
    <div class="bbtm">
      <button id="btnBcfg" class="bctl" title="設定・一時停止"></button>
      <button id="btnSpeed" class="bspd" title="倍速">×1</button>
      <div id="tray"></div>
      <button id="btnStart" class="readybtn">準備完了</button>
    </div>
  </div>

  <!-- ============ 下部タブ（ホームのときだけ） ============ -->
  <div id="tabs">
    <button data-tab="skill"><span class="ti" data-ic="tree"></span>スキル</button>
    <button data-tab="load"><span class="ti" data-ic="blades"></span>装備</button>
    <button data-tab="pack"><span class="ti" data-ic="pack"></span>パック<span id="badgePack" class="badge">0</span></button>
    <button data-tab="coll"><span class="ti" data-ic="grid"></span>図鑑</button>
    <button data-tab="pres"><span class="ti" data-ic="cycle"></span>転生</button>
  </div>

</div>

<div id="modal"></div>


<script src="src/util.js"></script>
<script src="src/icons.js"></script>
<script src="src/balance.js"></script>
<script src="src/stages.js"></script>
<script src="src/mapgen.js"></script>
<script src="src/weapons.js"></script>
<script src="src/cards.js"></script>
<script src="src/skilltree.js"></script>
<script src="src/relics.js"></script>
<script src="src/packs.js"></script>
<script src="src/state.js"></script>
<script src="src/draft.js"></script>
<script src="src/combat.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/cardfx.js"></script>
<script src="src/main.js"></script>
</body>
</html>
