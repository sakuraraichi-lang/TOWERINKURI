<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a10">
<meta name="description" content="インクリメンタル × ローグライト × タワーディフェンス × カード構築">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INKURIMENT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ ホーム ============ -->
  <!-- **1画面にいっぺんに詰め込まない。** ここはステージを選んで始めるだけ -->
  <div id="home">
    <div class="hbar">
      <div class="lvring"><b id="homeRank">0</b><i>RANK</i></div>
      <div class="hid">
        <div class="hnm" id="homeName2">指揮官</div>
        <div class="hxp"><i id="homeXp"></i></div>
        <div class="hnum" id="homeProg"></div>
      </div>
      <span id="build"></span>
      <button id="btnCfg" class="cfgbtn" title="設定">⚙</button>
      <div class="hpill"><s>◈</s><b id="homeCoin">0</b></div>
    </div>
    <!-- 版の説明。**「ver とは何か」が分からないと表示の意味が無い**ので、タップで出す -->
    <div id="buildNote"></div>
    <!-- 設定。⚙ で開く -->
    <div id="cfgBox"></div>

    <div id="homeMain">
      <button class="snav" id="homePrev" aria-label="前のステージ">◀</button>
      <div class="scard">
        <div class="heroart" id="homeMini"></div>
        <div class="htitle" id="homeName">—</div>
        <div class="hrule"><i>◆</i></div>
        <div class="hstageline" id="homeLabel">ステージ <b>1</b></div>
        <div class="hclear" id="homeStat"></div>
      </div>
      <button class="snav" id="homeNext" aria-label="次のステージ">▶</button>
    </div>

    <div class="startrow">
      <button id="homeStart" class="bigstart">出撃<s>▶</s></button>
      <!-- スキップ。**何も失わない。**解放条件を満たしたステージにだけ出る -->
      <button id="homeSkip" class="skipbtn">スキップ</button>
    </div>

    <!-- タブの中身。ホームにいるときだけ出る -->
    <div id="panel"></div>
  </div>

  <!-- ============ 戦場 ============ -->
  <!-- 4つの領域に分ける。**どれも重ならない。**
       盤面の上にボタンを浮かせていたせいで、
       置きたいところにユニット選択ボタンが被って置けないことがあった -->
  <div id="stage">

    <!-- 上：戦闘情報 -->
    <div class="btop">
      <div class="hphase" id="hudPhase">準備フェーズ</div>
      <div class="hlife"><i id="hudHpBar"></i><span id="hudHp"></span></div>
      <div id="perf"></div>
    </div>

    <div class="bmain">
      <!-- 左：ユニット -->
      <div id="tray"></div>

      <!-- 中央：盤面 -->
      <div class="bfield">
        <canvas id="cv"></canvas>
        <div id="upop"></div>
        <div id="toast"></div>
        <div id="tut"></div>
      </div>
    </div>

    <!-- 下：操作 -->
    <div class="bbtm">
      <button id="btnHome" class="ctl sq" title="ホームへ戻る">✕</button>
      <button id="btnSpeed" class="ctl sq">×1</button>
      <button id="btnPause" class="ctl sq">❙❙</button>
      <button id="btnMute" class="ctl sq" title="音">🔊</button>
      <div class="hwave" id="hudWaveTxt"></div>
      <button id="btnStart" class="readybtn">準備完了</button>
    </div>
  </div>

  <!-- ============ 下部タブ（ホームのときだけ） ============ -->
  <div id="tabs">
    <button data-tab="skill"><span class="ti">✦</span>スキル</button>
    <button data-tab="load"><span class="ti">⚔</span>装備</button>
    <button data-tab="pack"><span class="ti">⬢</span>パック<span id="badgePack" class="badge">0</span></button>
    <button data-tab="deck"><span class="ti">▤</span>デッキ</button>
    <button data-tab="coll"><span class="ti">◫</span>図鑑</button>
    <button data-tab="pres"><span class="ti">◉</span>転生</button>
  </div>

</div>

<div id="modal"></div>


<script src="src/util.js"></script>
<script src="src/balance.js"></script>
<script src="src/stages.js"></script>
<script src="src/mapgen.js"></script>
<script src="src/weapons.js"></script>
<script src="src/cards.js"></script>
<script src="src/skilltree.js"></script>
<script src="src/relics.js"></script>
<script src="src/packs.js"></script>
<script src="src/state.js"></script>
<script src="src/draft.js"></script>
<script src="src/combat.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
