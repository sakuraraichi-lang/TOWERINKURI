<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>INKURIMENT — パッチノート</title>
<style>
  /* 本体（style.css）と同じ色。**読み物なので、幅と行間だけは本体より広く取る** */
  :root{
    --bg:#070a10; --panel:#11161f; --line:#1e2633; --txt:#c9d1d9; --dim:#8b95a6;
    --acc:#ff7a18; --acc2:#6fe3ff; --ok:#7ef08a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.85 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    padding:0 0 64px;-webkit-text-size-adjust:100%;}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:10px 16px;background:rgba(7,10,16,0.92);border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);}
  .bar b{font-size:15px;letter-spacing:.04em;}
  .bar .sp{flex:1;}
  .back{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);text-decoration:none;font-size:13px;background:#131924;}
  .back:active{background:#1b2230;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 0;}
  .lead{color:var(--dim);font-size:13px;margin:0 0 20px;}
  h2{margin:34px 0 12px;padding:9px 12px;font-size:16px;letter-spacing:.03em;
    background:linear-gradient(90deg,#1a2231,transparent);
    border-left:3px solid var(--acc);border-radius:0 8px 8px 0;}
  h2:first-of-type{margin-top:8px;}
  h3{margin:22px 0 8px;font-size:14.5px;color:var(--acc2);}
  h1{font-size:18px;margin:0 0 6px;}
  p{margin:10px 0;}
  ul{margin:10px 0;padding-left:1.25em;}
  li{margin:5px 0;}
  hr{border:0;border-top:1px solid var(--line);margin:30px 0;}
  code{background:#161d29;border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  strong{color:#fff;}
  a{color:var(--acc2);}
  /* 表。**横に溢れるものは、表だけ横スクロールさせる**（本文は折り返す） */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:340px;}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;}
  th{background:#151c27;color:var(--dim);font-weight:600;white-space:nowrap;}
  blockquote{margin:12px 0;padding:8px 12px;border-left:3px solid var(--line);
    color:var(--dim);background:#0d121b;border-radius:0 6px 6px 0;}
  .err{color:#ff5b6e;}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="/">◀ ゲームへ</a>
  <b>パッチノート</b>
  <span class="sp"></span>
  <span id="ver" style="color:var(--dim);font-size:12px;"></span>
</div>
<div class="wrap"><div id="md">読み込み中…</div></div>

<script>
// **Markdown を、ここで最低限だけ組み立てる。**
//   外部ライブラリは入れない（本体と同じ方針。読み込みが増えるほど開かない）
//   対応するのは実際に PATCHNOTES.md で使っている記法だけ：
//   見出し / 表 / 箇条書き / 引用 / 強調 / コード / 水平線
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function render(src){
  const lines = src.replace(/\r/g,'').split('\n');
  const out = [];
  let i = 0, list = null, quote = null;
  const closeList = () => { if (list) { out.push('</ul>'); list = null; } };
  const closeQuote = () => { if (quote) { out.push('</blockquote>'); quote = null; } };
  while (i < lines.length) {
    const ln = lines[i];
    // 表：ヘッダ行 → 区切り行（|---|）→ 中身
    if (/^\s*\|/.test(ln) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1] || '')) {
      closeList(); closeQuote();
      const cells = (r) => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(ln);
      i += 2;
      let t = '<div class="tw"><table><tr>' + head.map(c=>'<th>'+inline(c)+'</th>').join('') + '</tr>';
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        t += '<tr>' + cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('') + '</tr>';
        i++;
      }
      out.push(t + '</table></div>');
      continue;
    }
    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) {
      closeList(); closeQuote();
      const h = Math.min(m[1].length, 4);
      out.push('<h' + h + '>' + inline(m[2]) + '</h' + h + '>');
    } else if (/^\s*[-*]\s+/.test(ln)) {
      closeQuote();
      if (!list) { out.push('<ul>'); list = 1; }
      out.push('<li>' + inline(ln.replace(/^\s*[-*]\s+/, '')) + '</li>');
    } else if (/^\s*>\s?/.test(ln)) {
      closeList();
      if (!quote) { out.push('<blockquote>'); quote = 1; }
      out.push(inline(ln.replace(/^\s*>\s?/, '')) + '<br>');
    } else if (/^\s*---+\s*$/.test(ln)) {
      closeList(); closeQuote(); out.push('<hr>');
    } else if (!ln.trim()) {
      closeList(); closeQuote();
    } else {
      closeList(); closeQuote();
      // **段落は、空行までをひとつに繋いでから組む。**
      //   1行ずつ処理すると、行をまたぐ **強調** が閉じられず生の ** が出る
      const buf = [];
      while (i < lines.length) {
        const q = lines[i];
        if (!q.trim() || /^\s*[-*]\s+/.test(q) || /^\s*>/.test(q)
            || /^#{1,4}\s/.test(q) || /^\s*---+\s*$/.test(q) || /^\s*\|/.test(q)) break;
        buf.push(q.trim()); i++;
      }
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
      continue;
    }
    i++;
  }
  closeList(); closeQuote();
  return out.join('\n');
}

// **版はゲーム本体と同じものを出す。**「開いたノートが古い」を切り分けるため
fetch('/src/balance.js?t=' + Date.now()).then(r => r.text()).then(t => {
  const m = t.match(/const BUILD = '([^']+)'/);
  if (m) document.getElementById('ver').textContent = 'ver ' + m[1];
}).catch(() => {});

fetch('/docs/PATCHNOTES.md?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { document.getElementById('md').innerHTML = render(t); })
  .catch(e => {
    document.getElementById('md').innerHTML =
      '<p class="err">パッチノートを読み込めませんでした（' + esc(String(e.message)) + '）。</p>' +
      '<p><a href="https://github.com/sakuraraichi-lang/TOWERINKURI/blob/main/docs/PATCHNOTES.md"' +
      ' target="_blank" rel="noopener">GitHub で見る</a></p>';
  });
</script>
</body>
</html>
