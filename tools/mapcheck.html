<!DOCTYPE html>
<meta charset="utf-8">
<title>INKURIMENT — マップ生成の検査</title>
<style>
  body { background: #0d1117; color: #c9d1d9; font: 13px/1.5 monospace; padding: 16px; }
  pre { background: #161b22; padding: 8px; border-radius: 6px; display: inline-block; margin: 4px; }
  h2 { color: #6fe3ff; }
  .bad { color: #ff5b6e; }
</style>
<body>
<h1>マップ生成の検査</h1>
<div id="out">測定中…</div>

<script>
// 本体のうち、マップ生成に要るものだけ読む
const BAL = { minRouteLen: 20 };
</script>
<script src="../src/util.js"></script>
<script src="../src/mapgen.js"></script>
<script>
const TILE_ = 40;
window.TILE = 40;

function ascii(m) { return m.rows.join('\n'); }

// 何通りできるか。**「違う」の判定は焼いたあとの文字列**
//   （部品が違っても焼いた結果が同じなら、遊ぶ側には同じマップ）
function variety(n) {
  const seen = new Set(), retries = [];
  let fail = 0;
  for (let i = 0; i < n; i++) {
    const m = MapGen.build(i * 104729 + 1);
    if (!m) { fail++; continue; }
    seen.add(m.rows.join('|'));
    retries.push(m.retries);
  }
  return { 作った: n, 別物: seen.size, 失敗: fail,
           作り直し平均: +(retries.reduce((a, b) => a + b, 0) / Math.max(1, retries.length)).toFixed(2),
           作り直し最大: Math.max.apply(null, retries) };
}

function stats(n) {
  const lens = [], grounds = [], roads = [], holes = [];
  for (let i = 0; i < n; i++) {
    const m = MapGen.build(i * 104729 + 1);
    if (!m) continue;
    lens.push(m.stat.shortest); grounds.push(m.stat.ground);
    roads.push(m.stat.road); holes.push(m.stat.holes);
  }
  const q = (a) => { a = a.slice().sort((x, y) => x - y);
    return a[0] + ' / ' + a[a.length >> 1] + ' / ' + a[a.length - 1]; };
  return { '最短経路 min/中央/max': q(lens), '地面 min/中央/max': q(grounds),
           '通路 min/中央/max': q(roads), '出現口タイル数 min/中央/max': q(holes) };
}

// **読み込んだだけでは回さない。**（六角セルにしてから1枚あたりが重くなり、
//   1300枚を自動で回すと画面が返ってこなくなった）
//   数を測るときは window.VARIETY(n) / window.MSTATS(n) を呼ぶ
const out = document.getElementById('out');
let html = '<h2>見本（6枚）</h2><p>数を測る → コンソールで VARIETY(200) / MSTATS(200)</p>';
for (let i = 0; i < 6; i++) {
  const m = MapGen.build(i * 104729 + 1);
  html += '<pre>' + (m ? ('seed' + i + ' 経路' + m.stat.shortest + ' 地面' + m.stat.ground +
    ' 穴' + m.vec.holes.length + '(幅' + m.vec.holes[0].w + ')\n' + ascii(m))
    : '<span class="bad">作れなかった</span>') + '</pre>';
}
out.innerHTML = html;
window.VARIETY = variety;
window.MSTATS = stats;
</script>
</body>
