<h1>INKURIMENT — バランス実測</h1>
<p class="lead">
  ゲーム本体のコードをそのまま読み込み、描画なしで回して到達ウェーブと突破までの挑戦回数を測る。<br>

  人が遊べばこれより上に出るので、<b>下限の目安</b>として読む。<br>
  カードの抽選が乱数なので、<b>指定した回数まわして中央値を取る</b>。1本だけだと当てにならない。
</p>

<script>
// 【重要】計測は localStorage に一切書かない。
// ゲーム本体と同じオリジンなので、書くとプレイヤーのセーブを壊してしまう
Game.save = function () {};
Game.load = function () { this.newSave(); return false; };

// 描画とDOMを使わずに回すため、UI と Render の必要な部分だけ差し替える
const Render = { fit() {}, resize() {} };
const UI = {
  draftOpen: false, placing: null,
  toastMsg() {}, renderTray() {}, renderPanel() {}, renderHud() {}, renderTabs() {},
  // 抽選は本体と同じ src/draft.js を使う（二重に書かない）
  eligibleCards() { return Draft.eligible(); },
  rollDraft(n) { return Draft.roll(n); },
};

// 30章ぶんの編成。**章ごとに手で書かない。**
// 設計書 §4-3 の武器解放の割付に合わせて、その章までに持っている武器から選ぶ
//
// **実ゲームの初期所持（cards.js の STARTER_CARDS）に合わせること。**
//   ここが本体とずれると、測定だけが本体より強い／弱い状態になる。
//   これまでに2回やらかしている：
//     1. ガトリング1種に勝手に絞って、第1章が 撃破1／漏れ20 で即死した
//     2. **スナイパーを最初から持たせていた**（2026-09-21 発覚）。
//        ユーザー決定「初期武器はガトリングでよし」を受けて本体は
//        STARTER_CARDS を wc_gatling だけにし、スナイパーは第2章の突破報酬
//        （gen30.py の CH_WEAPON[2]）へ回したのに、**こちらを直し忘れていた。**
//        第1〜2章を、実際には持っていない長射程で測っていたことになる
//
// 武器がいつ手に入るか。**数字は「その章を突破したときにもらえる」**。
//   本体は `clearStage` で報酬を配るので、**使えるのは次の章から**（だから `ch > w[0]`）。
//   出どころは tools/gen30.py の CH_WEAPON。ずれたら両方を直す
const WEAPON_START = ['gatling'];   // STARTER_CARDS。最初から持っているのはこれだけ
const WEAPON_AT = [
  [2, 'sniper'], [5, 'missile'], [8, 'tesla'],
  [11, 'flame'], [14, 'gas'], [17, 'cryo'], [20, 'mortar'],
];
// **パックから出る武器（刀・手裏剣・触手・泡）を編成に入れるか。**
//   これまで入れていなかった。`openAllPacks()` で手には入っているのに、
//   `loadoutFor` がステージ報酬の武器しか並べていなかったため、
//   **12種で一番強い刀（単独 dps 68／次点は41）が一度も編成されていなかった。**
//   本物のプレイヤーは持っていれば使うので、測定だけが弱い編成で走っていたことになる。
//   false にすると以前と同じ（比較用）
let USE_PACK_WEAPONS = true;

// 強い順。**第10章・単独編成・3シードの実測**（docs/DESIGN-CORE-2026-09-21.md §7）。
//   「新しい順」だと、章が進むだけで弱い武器に持ち替えてしまう。
//   人は持っている中から強いものを選ぶので、そちらに寄せる。
//   **連携（syn_*）は見ていない。**ここは単体の強さだけの代理指標
//   **弾のすり抜けを直したあと（0921t）に測り直した順**
const WEAPON_RANK = ['katana', 'sniper', 'shuriken', 'cryo', 'bubble', 'tesla',
                     'mortar', 'flame', 'gatling', 'missile', 'gas', 'tentacle'];

function loadoutFor(stageId) {
  const i = MAIN_STAGES.findIndex(s => s.id === stageId);
  const ch = i < 0 ? 1 : i + 1;
  const have = WEAPON_START.concat(WEAPON_AT.filter(w => ch > w[0]).map(w => w[1]));
  if (USE_PACK_WEAPONS) {
    // パック産は「持っているか」で決まる（章ではなく引き）
    for (const id of Object.keys(WEAPONS)) {
      if (WEAPONS[id].src !== 'pack') continue;
      if (Game.own('wc_' + id) && !have.includes(id)) have.push(id);
    }
  }
  // 編成枠は4。**強い順に取る**（実測の順位。持っていないものは飛ばす）
  const rank = (w) => { const r = WEAPON_RANK.indexOf(w); return r < 0 ? 99 : r; };
  return have.slice().sort((a, b) => rank(a) - rank(b)).slice(0, BAL.loadoutSlots);
}
const LOADOUTS = new Proxy({}, { get: (_, k) => loadoutFor(String(k)) });

// 計測用の自動配置。
// 本体は手で置く前提なので、ここでは「通路に面した地面へ、経路に沿って散らして置く」
// という素朴な置き方をする。人が考えて置けばこれより強くなる
// 置き場の評価は「その地点から、扇の中にどれだけ通路が入るか」で決める。
//
// **以前は通路に隣接するタイルしか候補にしていなかった。**
// どの武器も通路に張り付くので、射程430のスナイパーと射程100の刀が
// 同じ場所から撃つことになり、射程の差が測定上まるごと消えていた。
// 「非効率ビルドのほうが強い」という観測はこれを疑う必要がある
// （AIM_CACHE は廃止。**地形はもう固定ではない**ので、焼いた地形そのものに持たせる）

// ある射程・射界における、各地面タイルの最良の向きと点数。
//
//   **キャッシュは「焼いた地形」に持たせる。**（2026-09-21）
//   以前は `AIM_CACHE[st.id + 射程 + 射界]` で、コメントに「地形は固定なので」と
//   書いてあった。マップ生成（src/mapgen.js）を入れて**その前提が崩れた。**
//   同じ ch1 でも種が変われば地形が変わるのに、**前の地形の置き場所を返していた。**
//   結果、生成マップでは置いたユニットが通路を向いておらず、
//   **12個の種すべてで第1章が突破できず、与ダメージが 0 だった**（実測）。
//   地形ごとのオブジェクトに持たせれば、地形を作り直した時点で一緒に捨てられる
// thru … 壁を抜ける武器か（触手・刀・火炎・毒ガス）。
//   **本体が壁で射線を切るようになったので、ここも切る。**（2026-09-22）
//   切らないと、測定器だけが「壁の奥に埋めた砲が撃てるゲーム」を測ることになる
function aimField(st, range, arc, thru) {
  const cache = st._aim || (st._aim = {});
  const key = Math.round(range / 10) + '|' + Math.round(arc / 0.02) + '|' + (thru ? 1 : 0);
  if (cache[key]) return cache[key];

  // 通路タイル。コアに近いほど「抜かれたら困る場所」なので重みを増やす
  const path = [];
  let maxD = 1;
  for (let r = 0; r < st.rows; r++) {
    for (let c = 0; c < st.cols; c++) {
      if (!st.walkable(c, r)) continue;
      const d = st.dist[st.idx(c, r)];
      if (d >= 1e9) continue;
      if (d > maxD) maxD = d;
      path.push({ p: st.center(c, r), d });
    }
  }

  const N = 48;                       // 向きの候補（7.5度刻み）
  // **候補は六角セル。**（2026-09-23・設置がハニカムになった）
  //   タイルで回すと、本体と別の場所に置く測定器になる
  const out = [];
  {
    for (const h of st.hexCells()) {
      const c = h.c, r = h.r;
      const g = st.hexCenter(c, r);
      const seen = [];
      for (const t of path) {
        const dx = t.p.x - g.x, dy = t.p.y - g.y;
        const d = Math.hypot(dx, dy);
        if (d > range || d < 1) continue;
        if (!thru && Combat.losBlocked(st, g.x, g.y, t.p.x, t.p.y)) continue;
        seen.push({ a: Math.atan2(dy, dx), w: 1 + (1 - t.d / maxD) });
      }
      if (!seen.length) continue;
      let bw = 0, ba = 0;
      for (let k = 0; k < N; k++) {
        const a0 = -Math.PI + (k * 2 * Math.PI) / N;
        let w = 0;
        for (const s of seen) {
          let da = s.a - a0;
          while (da > Math.PI) da -= Math.PI * 2;
          while (da < -Math.PI) da += Math.PI * 2;
          if (Math.abs(da) <= arc) w += s.w;
        }
        if (w > bw) { bw = w; ba = a0; }
      }
      if (bw > 0) out.push({ c, r, a: ba, w: bw });
    }
  }
  out.sort((x, y) => y.w - x.w);
  cache[key] = out;
  return out;
}

// ---------------------------------------------------------------
// 扇の幅の実験（2026-09-19 追加）
//
// **これまで測定器は扇の幅を一度も変えていなかった。**
// 「絞ると集弾率が上がる／広げると守備範囲が増える」という中核のメカニクスが
// 測定にまったく入っていなかったので、幅を比べられるようにする。
//
// ARC_MODE
//   'base'   … 武器の初期値のまま（これまでの挙動）
//   'min'    … 最大まで絞る
//   'max'    … 最大まで広げる
//   'approx' … 下の近似評価で選ぶ
//
// **【重要】'approx' は近似です。**
// 「扇に入る通路の重み × 集弾率」が最大になる幅を選ぶだけで、
//   ・敵が実際にどこに固まるか
//   ・弾が飛んでいる間に敵が動くこと
//   ・味方同士の射線の重なり
// を一切見ていません。**どの幅が本当に強いかは、実際に戦闘を回して比べます。**
// 近似がその答えと一致するとは限らず、一致しない場合はそれ自体が結果です。
// ---------------------------------------------------------------
let ARC_MODE = 'base';

// 1回の出撃に許す実時間（ミリ秒）。超えたら 'slow' で打ち切る。
// **測定器が帰ってこないほうが困る**ので、精度より打ち切りを優先する。
//
// 【必ず守ること・2026-09-20 の事故から】
//   'slow' は **負けではない。打ち切りである。**
//   これを「壁」と取り違えて、
//     「第7章が壁」「第8章が壁」「第12章が壁」
//   と3回続けて誤った報告をした。上限を30秒まで延ばしたら、
//   **転生なしで第16章まで到達していた**（壁はそこに無かった）。
//
//   到達章を測るときは、**必ず res を記録して 'slow' を除外すること。**
//   'slow' が出たら、それは「この設定では測れていない」であって
//   「そこが限界」ではない。
//   TIME_MIN を 3.5 に詰めたので、最悪でも 12,600ステップ×2ms = 25秒。
//   60秒あれば深い章でも打ち切られない
let REAL_MS = 4000;

// 1回の出撃に許すゲーム内の分数。
//   **打切（'slow'）の正体はここだった。** 負けた試行はこの上限まで回りきるので、
//   6分だと 21,600ステップ。深い章は1ステップ2msかかるので実時間で43秒になり、
//   REAL_MS を30秒にしていると必ず打ち切られる（第11〜14章が全部これだった）。
//   1章の突破は実測 92〜166秒（1.5〜2.8分）なので、3.5分あれば足りる。
//
//   **【注意 2026-09-21】ウェーブを長くする調整を測るときは、ここを上げること。**
//   湧きを遅くする（spawnRateMax を下げる）掃引で、章が195〜205秒になった途端に
//   「到達9章」と出た。**本体には章ごとの時間制限が無い**ので、それは
//   ゲームの壁ではなく、この上限に当たっただけだった。
//   ウェーブ長を触る測定では TIME_MIN を先に上げる
let TIME_MIN = 3.5;

// ---------------------------------------------------------------
// シード固定と、到達章の分布
//
//   **1回の到達章は根拠にならない。** 上の事故（'slow' を壁と誤認）の直後に
//   「転生なしで第16章」と書いたが、それも**1シードの1回**だった。
//   運が絡む以上、同じ条件を複数シードで回して**分布**で見ないと、
//   「緩い／厳しい」は言えない。
//
//   本体のコードはすべて素の Math.random を呼ぶので、
//   グローバルを差し替えるだけで全体が決定的になる
// ---------------------------------------------------------------
//   **シードを固定しても、結果は毎回わずかにずれる。原因は未特定。**
//
//   絞り込んだところまで（2026-09-21）:
//     ・乱数そのものは同じ（seedRng(77) を2回して先頭3個が一致）
//     ・戦闘だけを4,000ステップ回すと**ちょうど2通りの結果**に分かれる
//       （8回で 3回対5回）。連続的なズレではなく**枝の分岐**に見える
//     ・出撃をまたいで残る Combat.coinFx を毎回0に戻しても変わらない
//     ・割れ始めるのは **720ステップ目**。そのとき敵の数・弾の数・与ダメージは
//       **完全に一致していて、座標だけが違う**。つまり枝ではなく**数値のずれ**
//     ・Math.cos/sin/atan2/hypot/pow/sqrt を 1e-9 に丸めても、
//       **ハッシュが1ビットも変わらなかった**。差し替えたはずの関数が
//       使われていない＝V8が最適化後のコードに直接埋め込んでいる
//
//   **有力な説明（未確定）**：V8 は Math.cos などを最適化後のコードに埋め込み、
//   最適化前は実行時の関数を呼ぶ。この2つは最後の桁が違うことがある。
//   どちらが動くかは最適化が入るタイミング次第なので、**結果がちょうど2通りになる。**
//   直すには三角関数を自前の多項式に置き換えるしかなく、ゲーム側の利得が無い。
//
//   ここで打ち切る。**実害は複数回の平均を取れば避けられる。**
//   実測：同じシード77で第1章を4回 → 97/98/103/98撃破。
//   組み込み前（セル鍵が文字列だった頃）も 99/101/100/96 で同じように揺れるので、
//   最近の変更のせいではない。戦闘そのものは決定的で、
//   600ステップ回した盤面のハッシュは3回とも一致する。ずれ始めるのは40秒あたり。
//
//   **つまり「1回ずつ回して比べる」は使えない。** 実際これで、
//   正しい最適化（targetAhead の打ち切り）を一度「結果が変わる」と却下しかけた。
//   A/B を見るときは**必ず複数回の平均で**。
const _sysRandom = Math.random;
function seedRng(seed) {
  let t = seed >>> 0;
  Math.random = function () {
    t += 0x6D2B79F5;
    let r = t;
    r = Math.imul(r ^ (r >>> 15), r | 1);
    r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function unseedRng() { Math.random = _sysRandom; }

// 周1と周2の到達章を、シードを変えて何本も取る。
//   note が '打切' の行は **測れていない行**。壁として数えないこと
function reachDist(seeds, opts) {
  opts = opts || {};
  const rows = [];
  for (const sd of seeds) {
    seedRng(sd);
    const a = campaignRun(sg => LOADOUTS[sg.id], Object.assign({}, opts, { label: '周1' }));
    const la = a.stages[a.stages.length - 1] || {};
    const row = { seed: sd, 周1到達: a.cleared, 周1分: a.totalMin, 周1打切: la.note || '' };
    if (Game.canPrestige()) {
      const got = Game.prestige();
      const b = campaignRun(sg => LOADOUTS[sg.id],
        Object.assign({}, opts, { reset: false, label: '周2' }));
      const lb = b.stages[b.stages.length - 1] || {};
      row.遺物パック = got.reward;
      row.周2到達 = b.cleared; row.周2分 = b.totalMin; row.周2打切 = lb.note || '';
    } else {
      row.周2到達 = '転生不可';
    }
    rows.push(row);
  }
  unseedRng();
  return rows;
}

// 長い測定は**非同期で回す。** campaignRun は同期なので、30章×15回リトライ×
// 実時間上限30秒が重なると、ブラウザが何分も固まって外から様子が見えなくなる。
// 章と章のあいだで1回イベントループに返し、途中経過を window.DIST に置く
//   **実時間では打ち切らない。** 実時間の上限は「測定器が遅いかどうか」でしかなく、
//   それで止めた行を到達章として並べると、**軽くした版ほど深く見える**という
//   嘘の結果になる（実際 0921c で第14章、同じバランスの 0921d で第17章と出た）。
//   代わりに**ゲーム内の上限（TIME_MIN）と挑戦回数（tries）で区切る。**
//   どちらもゲーム側の条件なので、打ち切りではなく「抜けられなかった」と読める。
//
//   章ごとに何回目で抜けたかも残す。**壁がどこかは、到達章よりこちらに出る**
async function reachDistAsync(seeds, opts) {
  opts = opts || {};
  const tries = opts.tries || 6;
  //   **測る章の上限。** 深い章は1回の挑戦に実時間で分単位かかるので、
  //   30章まで通すと1周に何時間もかかる。知りたいのは壁の位置なので、
  //   そこを含む範囲だけ測って「ここまでで止まった／ここまで全部抜けた」を出す
  const maxCh = opts.maxCh || MAIN_STAGES.length;
  const yieldNow = () => new Promise(r => setTimeout(r, 0));
  const st = window.DIST = { rows: [], done: false, now: '', t0: performance.now() };

  async function lap(label, reset) {
    if (reset) Game.newSave();
    let cleared = 0, sec = 0, note = '', lastName = '';
    const tryLog = [], resLog = [];
    for (const stg of MAIN_STAGES.slice(0, maxCh)) {
      st.now = label + ' ' + stg.name;
      await yieldNow();
      // **スキップできる章はスキップする。**
      //   これまでの測定は毎周ぜんぶ手で殴り直していた。本体には
      //   「完璧クリア済み、または 転生1回＋通算3回突破」で押せるボタンがあり、
      //   **【2026-09-22】スキップは報酬ゼロになった。**（`Game.skipStage`）
      //   チェックマークが付いて次へ進めるだけで、コインもカードも入らない。
      //   前は「前に手で突破したときの最高コイン」が入っていて、
      //   ユーザー報告「もらえる金額が多すぎて30章を完全クリアされた」
      //   使う前提で測らないと、再攻略の時間を実際より長く見積もる
      if (opts.useSkip !== false && Game.canSkip(stg.id)) {
        Game.skipStage(stg.id);
        cleared++; tryLog.push(0); resLog.push('S'); lastName = stg.name;
        continue;
      }
      let ok = false, used = 0;
      for (let i = 1; i <= tries; i++) {
        if (opts.noPacks !== true) openAllPacks();
        const r = runStage(stg.id, LOADOUTS[stg.id], 90, opts);
        sec += r.sec; used = i; resLog.push(r.res[0]);
        if (r.res === 'clear') { ok = true; cleared++; break; }
        // 'slow' が出たら測定器が追いつかなかった行。**隠さず印を残す**
        if (r.res === 'slow') { note = '打切'; break; }
      }
      tryLog.push(used);
      lastName = stg.name;
      if (!ok) { if (!note) note = ''; break; }
    }
    if (cleared >= maxCh) note = note || '上限まで全部突破';
    //   res の頭文字： c=突破 d=敗北 t=時間切れ s=打切
    return { cleared, min: +(sec / 60).toFixed(1), note, last: lastName,
             tries: tryLog.join(','), res: resLog.join('') };
  }

  st.lap = lap;          // 周回を重ねる測定（progressAsync）から使い回す
  for (const sd of seeds) {
    seedRng(sd);
    const a = await lap('周1 seed' + sd, true);
    const row = { seed: sd, 周1到達: a.cleared, 周1分: a.min, 周1打切: a.note,
                  周1最後: a.last, 周1挑戦回数: a.tries, 周1結果: a.res };
    if (Game.canPrestige()) {
      row.遺物パック = Game.prestige().reward;
      const b = await lap('周2 seed' + sd, false);
      row.周2到達 = b.cleared; row.周2分 = b.min; row.周2打切 = b.note; row.周2最後 = b.last;
      row.周2挑戦回数 = b.tries; row.周2結果 = b.res;
    } else { row.周2到達 = '転生不可'; row.周2打切 = ''; }
    st.rows.push(row);
  }
  unseedRng();
  st.done = true;
  st.実秒 = +((performance.now() - st.t0) / 1000).toFixed(1);
  return st.rows;
}

// ---------------------------------------------------------------
// カード1枚ずつの寄与を測る
//
//   武器12種を同じ条件で測ったら **7.6倍の開き**があった（刀68／触手9）。
//   カードは59種あって一度も測っていないので、同じ穴を探す。
//
//   測り方：3択を止めて、そのカードだけを上限枚数まで掛けた状態で1章まわし、
//   **何も引かなかったときの dps と比べる。**
//     倍率 = そのカードを積んだときの dps ÷ 何も引かないときの dps
//
//   **武器カードと鍵は測らない**（編成そのものなので、武器の測定と二重になる）。
//   連携カード（syn_*）は requires の武器を両方積んだ編成で測る。
//
//   結果 → window.CARDSCAN.rows[] = { id, name, rarity, weapon, n, mul }
// ---------------------------------------------------------------
async function cardScanAsync(opts) {
  opts = opts || {};
  const stage = opts.stage || 'ch10';
  const seeds = opts.seeds || [11, 22];
  const buys = opts.buys || 120;
  const cs = window.CARDSCAN = { rows: [], done: false, now: '', t0: performance.now() };
  const yieldNow = () => new Promise(r => setTimeout(r, 0));

  // そのカードを測るのに必要な編成
  const loadoutOf = (c) => {
    if (c.requires) return c.requires.slice(0, BAL.loadoutSlots);
    if (c.weapon) return [c.weapon];
    return ['gatling'];                    // 汎用カードはガトリングの上で測る
  };
  const med = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];

  // **深い章で測るための元手と土台。**（2026-09-22）
  //   これが無いと、開いていない章が黙って第1章に差し替えられていた
  //   （0921u のカードの表は、第10章と書いてあるが実際は第1章の数字だった）
  const deep = opts.deep || { prestiges: 2, deepest: 10 };
  const coins = opts.coins || 1e9;
  const base = {};                          // 編成ごとの「何も引かない」与ダメージ
  const dpsOf = (lo, pre) => {
    const out = [];
    for (const sd of seeds) {
      seedRng(sd); Game.newSave();
      const r = runStage(stage, lo, buys, { noDraft: true, preCards: pre,
                                            coins: coins, deep: deep, lives: 100000 });
      // **1ウェーブあたりの与ダメージ。** 通しの平均だと、長く生き残った側が
      //   薄まって不利になる（ライフを厚くして必ず5ウェーブ回すのと対）
      out.push(r.waves.reduce((a, x) => a + x.dps * x.sec, 0) / Math.max(1, r.waves.length));
    }
    return med(out);
  };

  for (const id of CARD_IDS) {
    const c = CARDS[id];
    if (c.kind === 'weapon' || c.kind === 'key' || c.kind === 'perm') continue;
    if (!c.apply) continue;
    cs.now = c.name;
    await yieldNow();
    const lo = loadoutOf(c);
    const k = lo.join('/');
    if (base[k] === undefined) base[k] = dpsOf(lo, null);
    const n = c.maxStack || 1;
    const with1 = dpsOf(lo, { [id]: 1 });
    const withN = n > 1 ? dpsOf(lo, { [id]: n }) : with1;
    cs.rows.push({ id, name: c.name, rarity: c.rarity, kind: c.kind, weapon: c.weapon || k,
                   stack: n, base: Math.round(base[k]),
                   one: +(with1 / (base[k] || 1)).toFixed(2),
                   full: +(withN / (base[k] || 1)).toFixed(2) });
  }
  unseedRng();
  cs.rows.sort((a, b) => b.full - a.full);
  cs.done = true;
  cs.実秒 = +((performance.now() - cs.t0) / 1000).toFixed(1);
  return cs.rows;
}

// ---------------------------------------------------------------
// 何回転生すれば何章まで行けるか（周回を重ねて測る）
//
//   **これがバランスの中心の指標。**（設計書 docs/DESIGN-CORE-2026-09-21.md §5）
//   ユーザーの狙いは「転生4回くらいで第13章」。
//
//   これまで毎回ブラウザのコンソールに書き捨てのループを打っていたので、
//   **測るたびに条件が微妙に違っていた。**関数にして条件を固定する。
//
//   結果 → window.PROG.rows[] = { seed, laps:[到達章...], line:'3 → 6 → 9 → …' }
// ---------------------------------------------------------------
async function progressAsync(seeds, opts) {
  opts = opts || {};
  const laps = opts.laps || 8;
  const yieldNow = () => new Promise(r => setTimeout(r, 0));
  const pg = window.PROG = { rows: [], done: false, now: '', t0: performance.now() };

  for (const sd of seeds) {
    seedRng(sd);
    Game.newSave();
    const got = [], mins = [], tries = [], notes = [], slots = [];
    for (let L = 1; L <= laps; L++) {
      pg.now = 'seed' + sd + ' 周' + L;
      // **1周を歩く手順は reachDistAsync と同じものを使う。**
      //   （seeds を空で呼ぶと、周を歩く関数だけ作って何も測らずに返る）
      await reachDistAsync([], opts);
      const lap = window.DIST.lap;
      window.DIST.now = '';
      const r = await lap('seed' + sd + ' 周' + L, L === 1);
      pg.now = 'seed' + sd + ' 周' + L + ' → ' + r.cleared + '章';
      got.push(r.cleared); mins.push(r.min); tries.push(r.tries); notes.push(r.note);
      slots.push(Game.slotsTotal());        // その周の終わりに何基置けたか
      // **章ごとの挑戦回数（tries）を残す。**
      //   0 はスキップ、1 は一発、2以上は詰まった章 ＝ ストップポイント。
      //   到達章の数字だけ見ていると「どこで詰まったか」が分からず、
      //   BAL.chapterMul をどこに置けばいいかが決められなかった
      pg.rows = pg.rows.filter(x => x.seed !== sd)
        .concat([{ seed: sd, laps: got.slice(), mins: mins.slice(), slots: slots.slice(),
                   tries: tries.slice(), notes: notes.slice(), line: got.join(' → ') }]);
      await yieldNow();
      if (r.cleared >= MAIN_STAGES.length) break;
      if (!Game.canPrestige()) break;
      Game.prestige();
    }
  }
  unseedRng();
  pg.done = true;
  pg.実秒 = +((performance.now() - pg.t0) / 1000).toFixed(1);
  return pg.rows;
}

// 分布のまとめ。**打切の行は除いて数える**
function reachStat(rows, key, noteKey) {
  const v = rows.filter(r => !r[noteKey] && typeof r[key] === 'number').map(r => r[key]);
  const cut = rows.filter(r => r[noteKey]).length;
  if (!v.length) return { n: 0, 打切: cut };
  v.sort((x, y) => x - y);
  return {
    n: v.length, 打切: cut,
    最小: v[0], 中央: v[(v.length - 1) >> 1], 最大: v[v.length - 1],
    平均: +(v.reduce((a, x) => a + x, 0) / v.length).toFixed(1),
    全部: v.join(','),
  };
}

// 幅の候補。BAL の刻みに合わせる
function arcCandidates() {
  const out = [];
  for (let a = BAL.arcMin; a <= BAL.arcMax + 1e-9; a += BAL.arcStep) out.push(+a.toFixed(4));
  if (out[out.length - 1] < BAL.arcMax - 1e-9) out.push(BAL.arcMax);
  return out;
}

// 近似評価：その地点・その向きで、幅ごとの「通路の重み × 集弾率」
function arcScores(st, c, r, face, range, _arcDef) {
  // (c,r) は六角セル（2026-09-23）
  const g = st.hexCenter(c, r);
  const seen = [];
  let maxD = 1;
  for (let rr = 0; rr < st.rows; rr++) for (let cc = 0; cc < st.cols; cc++) {
    if (!st.walkable(cc, rr)) continue;
    const d = st.dist[st.idx(cc, rr)];
    if (d < 1e9 && d > maxD) maxD = d;
  }
  for (let rr = 0; rr < st.rows; rr++) for (let cc = 0; cc < st.cols; cc++) {
    if (!st.walkable(cc, rr)) continue;
    const d = st.dist[st.idx(cc, rr)];
    if (d >= 1e9) continue;
    const p = st.center(cc, rr);
    const dx = p.x - g.x, dy = p.y - g.y;
    const dist = Math.hypot(dx, dy);
    if (dist > range || dist < 1) continue;
    let da = Math.atan2(dy, dx) - face;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    seen.push({ da: Math.abs(da), w: 1 + (1 - d / maxD) });
  }
  return arcCandidates().map(arc => {
    let cover = 0;
    for (const t of seen) if (t.da <= arc) cover += t.w;
    // 集弾率は本体と同じ式を使う（ui.js/state.js の groupingOf）
    const grouping = Game.groupingOf({ arc, def: _arcDef });
    return { arc, cover: +cover.toFixed(2), grouping: +grouping.toFixed(3),
             score: +(cover * grouping).toFixed(2) };
  });
}

// 置いたユニットに ARC_MODE の幅を与える
function applyArc(u, st) {
  if (ARC_MODE === 'base') return u.arc;
  let want;
  const _ar = Game.arcRange(u.def);
  if (ARC_MODE === 'min') want = _ar.min;
  else if (ARC_MODE === 'max') want = _ar.max;
  else {
    const rows = arcScores(st, u.c, u.r, u.face, u.s.range, u.def);
    want = rows.reduce((a, b) => (b.score > a.score ? b : a), rows[0]).arc;
  }
  Game.setArc(u, want - u.arc);
  return u.arc;
}

// ---------------------------------------------------------------
// ウェーブ間の再配置（2026-09-19 追加）
//
// **測定器は最初に1回置いたら、最後まで一度も動かしていなかった。**
// 本体では「ウェーブとウェーブの間に置き直す」のがこのゲームの本体なので、
// その分だけ測定が実際より弱く出ていた。
//
// 置き直すときは、**実際に敵が通ったところ（通行量ヒートマップ）**を見る。
// プレイヤーに見せている手がかりと同じものを使う
// ---------------------------------------------------------------
let REPLACE_MODE = false;      // true でウェーブ間に置き直す

// (ステージ, 射程) ごとに「その地面から見える通路」を1度だけ作る。
// 重み付けを変えて何度も評価したいので、見えるかどうかの計算だけ先に済ませる
const SEEN_CACHE = {};
function seenField(st, range) {
  const key = st.id + '|' + Math.round(range / 10);
  if (SEEN_CACHE[key]) return SEEN_CACHE[key];
  const path = [];
  let maxD = 1;
  for (let r = 0; r < st.rows; r++) for (let c = 0; c < st.cols; c++) {
    if (!st.walkable(c, r)) continue;
    const d = st.dist[st.idx(c, r)];
    if (d >= 1e9) continue;
    if (d > maxD) maxD = d;
    path.push({ p: st.center(c, r), d, i: st.idx(c, r) });
  }
  // **候補は六角セル。**（2026-09-23・設置がハニカムになった）
  const out = [];
  for (const h of st.hexCells()) {
    const c = h.c, r = h.r;
    const g = st.hexCenter(c, r);
    const seen = [];
    for (const t of path) {
      const dx = t.p.x - g.x, dy = t.p.y - g.y;
      const d = Math.hypot(dx, dy);
      if (d > range || d < 1) continue;
      seen.push({ a: Math.atan2(dy, dx), base: 1 + (1 - t.d / maxD), i: t.i });
    }
    if (seen.length) out.push({ c, r, seen });
  }
  SEEN_CACHE[key] = out;
  return out;
}

// 通行量で重みづけして、置き場所と向きを選び直す
function heatField(st, range, arc, traffic) {
  let mt = 0;
  for (let i = 0; i < traffic.length; i++) if (traffic[i] > mt) mt = traffic[i];
  const N = 24;                                  // 15度刻み（再配置は毎ウェーブ走るので粗くする）
  const out = [];
  for (const tile of seenField(st, range)) {
    let bw = 0, ba = 0;
    for (let k = 0; k < N; k++) {
      const a0 = -Math.PI + (k * 2 * Math.PI) / N;
      let w = 0;
      for (const sn of tile.seen) {
        let da = sn.a - a0;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        // **実際に敵が通ったところを重く見る。** 通らなかった道は守っても意味がない
        if (Math.abs(da) <= arc) w += sn.base * (mt > 0 ? 0.35 + 1.3 * (traffic[sn.i] / mt) : 1);
      }
      if (w > bw) { bw = w; ba = a0; }
    }
    if (bw > 0) out.push({ c: tile.c, r: tile.r, a: ba, w: bw });
  }
  out.sort((x, y) => y.w - x.w);
  return out;
}

// ウェーブ間に置き直す。**全部どけてから、通行量を見て置き直す**
function replaceUnits(run) {
  const st = run.stage;
  const mods = Skill.mods(Game.meta, Game.perm);
  const statOf = (wid) => {
    const def = WEAPONS[wid];
    const fake = { def, s: Object.assign({}, def.base) };
    Skill.applyTo(fake, mods);
    return { range: fake.s.range, arc: fake.s.arc, thru: !!def.wallThrough };
  };
  const want = [];
  for (const wid of Game.loadoutWeapons()) for (let i = 0; i < Game.unitCap(wid); i++) want.push(wid);
  want.sort((a, b) => statOf(b).range - statOf(a).range);

  for (const u of run.units.slice()) Game.removeUnit(u);

  const taken = {};
  const far = (c, r, min2) => {
    for (const k in taken) {
      const i = k.indexOf(',');
      const dc = (+k.slice(0, i)) - c, dr = (+k.slice(i + 1)) - r;
      if (dc * dc + dr * dr < min2) return false;
    }
    return true;
  };
  for (const wid of want) {
    const s0 = statOf(wid);
    const field = heatField(st, s0.range, s0.arc, run.traffic);
    // **武器ごとに要るマスが違う**（weapons.js の foot）ので、
    //   1か所だけ見て諦めると置けない。**置けるまで候補を順に試す。**
    //   ここを1か所で打ち切っていたせいで、2×2の武器がほぼ置けず、
    //   通しが 2→5→9→4→4→4 と崩れた（実測 2026-09-22）
    const def = WEAPONS[wid];
    let u = null, pick = null;
    // まず「離れていて良い場所」、無ければ順に
    const order = field.filter(f => !taken[f.c + ',' + f.r]);
    const spaced = order.filter(f => far(f.c, f.r, 5));
    for (const f of spaced.concat(order)) {
      if (!Game.canPlaceAt(def, f.c, f.r)) continue;
      u = Game.placeUnit(wid, f.c, f.r);
      if (u) { pick = f; break; }
    }
    if (!u) continue;
    for (const t of Game.tilesOf(u)) taken[t.c + ',' + t.r] = 1;
    Game.aimUnit(u, pick.a);
    applyArc(u, st);
  }
  Game.applyMods();
  // 置き直したユニットには、これまでに引いたカードを掛け直す。
  // **掛け直す前に、カードがラン単位で積む値を戻す。**
  // 戻さないと、置き直すたびにコイン倍率などが二重に乗ってしまう。
  // resonance は戦闘中に貯まる値でカードが積むものではないので、触らない
  run.coinMul = 1;
  run.chillVuln = BAL.chillVulnBase;
  run.backdraft = 0;
  for (const id in run.cards) {
    const c = CARDS[id];
    if (!c.apply) continue;
    for (let i = 0; i < run.cards[id]; i++) Game.applyCard(id, run);
  }
}

// 【比較用】以前の配置。通路に隣接するタイルにしか置かない。
// これを残してあるのは、「ビルド差が逆転している」という観測が
// ゲーム側の話なのか、この配置のせいなのかを同じ条件で見比べるため
function autoPlaceHug(run) {
  const st = run.stage;
  // **候補は六角セル。**（2026-09-23・設置がハニカムになった）
  const cand = [];
  for (const h of st.hexCells()) {
    const g = st.hexCenter(h.c, h.r);
    // その六角の中心からいちばん近い通路タイルの「コアまでの距離」を見る
    let near = Infinity;
    for (let rr = 0; rr < st.rows; rr++) for (let cc = 0; cc < st.cols; cc++) {
      if (!st.walkable(cc, rr)) continue;
      const p = st.center(cc, rr);
      if (Math.hypot(p.x - g.x, p.y - g.y) > TILE * 1.6) continue;
      const d = st.dist[st.idx(cc, rr)];
      if (d < near) near = d;
    }
    if (near < Infinity) cand.push({ c: h.c, r: h.r, near });
  }
  cand.sort((a, b) => a.near - b.near);
  if (!cand.length) return;
  const types = Game.loadoutWeapons();
  const want = [];
  for (const wid of types) for (let i = 0; i < Game.unitCap(wid); i++) want.push(wid);
  const taken = {};
  want.forEach((wid, i) => {
    const idx = Math.min(cand.length - 1, Math.floor(cand.length * (i + 0.5) / want.length));
    for (let k = 0; k < cand.length; k++) {
      const t = cand[(idx + k) % cand.length];
      if (taken[t.c + ',' + t.r]) continue;
      if (!Game.canPlaceAt(WEAPONS[wid], t.c, t.r)) continue;
      const u = Game.placeUnit(wid, t.c, t.r);
      if (!u) continue;
      for (const q of Game.tilesOf(u)) taken[q.c + ',' + q.r] = 1;
      break;
    }
  });
}

// 'range' … 射線が通る場所に置く（既定） / 'hug' … 旧・通路張り付き
let PLACE_MODE = 'range';

function autoPlace(run) {
  if (PLACE_MODE === 'hug') return autoPlaceHug(run);
  return autoPlaceRange(run);
}

function autoPlaceRange(run) {
  const st = run.stage;
  const mods = Skill.mods(Game.meta, Game.perm);

  // この時点で乗っているのはスキルだけ（カードは戦闘中に引く）
  const statOf = (wid) => {
    const def = WEAPONS[wid];
    const fake = { def, s: Object.assign({}, def.base) };
    Skill.applyTo(fake, mods);
    return { range: fake.s.range, arc: fake.s.arc };
  };

  const want = [];
  for (const wid of Game.loadoutWeapons()) {
    for (let i = 0; i < Game.unitCap(wid); i++) want.push(wid);
  }
  // 射程の長いものから場所を取る。後回しにすると良い遠射点が埋まってしまう
  want.sort((a, b) => statOf(b).range - statOf(a).range);

  const taken = {};
  const far = (c, r, min2) => {
    for (const k in taken) {
      const i = k.indexOf(',');
      const dc = (+k.slice(0, i)) - c, dr = (+k.slice(i + 1)) - r;
      if (dc * dc + dr * dr < min2) return false;
    }
    return true;
  };

  for (const wid of want) {
    const s0 = statOf(wid);
    const field = aimField(st, s0.range, s0.arc, s0.thru);
    // まず「味方と離れた良い点」、無ければ空いている最良点。
    // **置けるまで次の候補へ進む。**（2026-09-22）
    //   武器ごとに要るマス数が違うので、最良点1つを試して駄目なら諦める、だと
    //   縦2・横2の武器がほとんど置けず、通しが `2→5→9→4→4→4` に崩れた。
    //   プレイヤーは「入らなかったら隣に置く」ので、測定器もそうする
    const def = WEAPONS[wid];
    const open = field.filter(f => !taken[f.c + ',' + f.r]);
    let u = null, pick = null;
    for (const f of open.filter(f => far(f.c, f.r, 5)).concat(open)) {
      if (!Game.canPlaceAt(def, f.c, f.r)) continue;
      u = Game.placeUnit(wid, f.c, f.r);
      if (u) { pick = f; break; }
    }
    if (!u) continue;
    for (const t of Game.tilesOf(u)) taken[t.c + ',' + t.r] = 1;
    Game.aimUnit(u, pick.a);
    applyArc(u, st);
  }
}

// ---------------------------------------------------------------
// 1回の出撃をまるごと回す。
//
// **「突破したか」だけでなく、経済の数字を全部持ち帰る。**
// 強い/弱いではなく「どこで経済曲線が壊れているか」を見たいので、
// コイン・購入・カード・被害・死因までウェーブ単位で記録する
//
//   opts.bal    … BAL を一時的に差し替える（調整前後を同じコードで比べる）
//   opts.noLure … 敵誘引を買わせない（リスク・リターンの比較用）
//   opts.buildId… どのビルドの行かを記録に残す
// ---------------------------------------------------------------
function withBal(over, fn) {
  if (!over) return fn();
  const keep = {};
  for (const k in over) { keep[k] = BAL[k]; BAL[k] = over[k]; }
  try { return fn(); } finally { for (const k in keep) BAL[k] = keep[k]; }
}

function runStage(stageId, loadout, buys, opts) {
  opts = opts || {};
  const keepArc = ARC_MODE, keepRep = REPLACE_MODE;
  if (opts.arc) ARC_MODE = opts.arc;
  if (opts.replace !== undefined) REPLACE_MODE = opts.replace;
  try {
    return withBal(opts.bal, () => runStageInner(stageId, loadout, buys, opts));
  } finally { ARC_MODE = keepArc; REPLACE_MODE = keepRep; }
}

// **測りたい章を開けておく。**
//   `Game.startPrep` は `if (!this.stageUnlocked(stageId)) stageId = 'ch1';` で、
//   **開いていない章を黙って第1章に差し替える。**
//   そのせいで「第10章で測った」と書いた表が、**実際には第1章の数字**だった
//   （武器12種の比較・カード59枚の比較・弾のすり抜けのA/B）。
//   報酬は配らずに「突破済み」の印だけ立てる（報酬を配ると編成と手札が変わり、
//   比べたいものが比べられなくなる）。
//   progressAsync は章を順番に本当に突破していくので、こちらの影響は受けない
function unlockTo(stageId) {
  const i = MAIN_STAGES.findIndex(s => s.id === stageId);
  for (let k = 0; k < i; k++) Game.stageRec(MAIN_STAGES[k].id).cleared = true;
}

function runStageInner(stageId, loadout, buys, opts) {
  if (opts.unlock !== false) unlockTo(stageId);
  // **比べるための元手。** 章を開けただけでは財布は空なので、深い章に置いても
  //   強化が1段も買えず、どの武器でも撃破0になる（実測）。
  //   本当に遊べば前の章ぶんのコインを持って来るので、
  //   **武器どうしを比べるときは同じ額を持たせてから買わせる**
  if (opts.coins) Game.meta.coins = opts.coins;
  // **恒久の土台を持たせる。**（relics.js の Legacy）
  //   土台は `prestiges > 0` と `legacyDeep` からしか出ないので、
  //   まっさらなセーブで深い章に置くと、**設計どおり手も足も出ない**
  //   （元手を 1e11 積んで強化を120段買っても撃破0。第10章は1周目では届かない章）。
  //   深い章で武器やカードを比べるときは、そこへ到達した人の土台を再現する
  if (opts.deep) {
    Game.perm.prestiges = opts.deep.prestiges;
    Game.perm.deepest = opts.deep.deepest;
    // **土台の基準は legacyDeep。**（2026-09-22）
    //   本体は転生のときだけ deepest から写すので、
    //   測定器も同じ値を入れておかないと土台が0倍のままになる
    Game.perm.legacyDeep = opts.deep.deepest;
    Relic.invalidate();
  }
  Game.perm.loadout = loadout.map(w => 'wc_' + w);
  for (const w of loadout) if (!Game.own('wc_' + w)) Game.grant('wc_' + w, 1);
  Game.perm.currentStage = stageId;
  const run0 = Game.startPrep(stageId);

  // 安い順に買う。買った額も数えておく（コインの出口はここだけ）
  let spent = 0, bought = 0;
  for (let i = 0; i < buys; i++) {
    // **本体の買い方（Skill.buyOrder）をそのまま使う。**
    //   ここに別の順番を書くと「測っているもの」と「遊んでいるもの」がずれる。
    //   取り切りの節を先に買う（安い順だけだと主力のダメージ節を買い逃す）
    let ids = Skill.buyOrder(Game.meta, Game.perm);
    if (opts.noLure) ids = ids.filter(id => id !== 'lure');
    if (!ids.length) break;
    const c = Skill.cost(Game.meta, ids[0]);
    if (Skill.buy(Game.meta, Game.perm, ids[0])) { spent += c; bought++; }
  }
  autoPlace(run0);
  Game.applyMods();
  Game.beginBattle();

  const run = Game.run;
  // **ライフを厚くして、必ず5ウェーブ最後まで回す。**
  //   武器を比べるとき、途中で落ちると「そこまでの漏れ」しか数えられず、
  //   **弱い武器ほど数字が小さく出る**（早く死ぬので漏れも少ない）。
  //   最後まで回してから漏れの総数で比べる。beginBattle が lives を
  //   livesMax で埋め直すので、**その後**に上書きする
  if (opts.lives) { run.livesMax = opts.lives; run.lives = opts.lives; }
  // **カード1枚の寄与を測るための口**（cardScan が使う）。
  //   opts.preCards = { カードid: 枚数 } を戦闘開始時に掛ける
  //   opts.noDraft = true でウェーブ間の3択を止める
  //   この2つを併せると「そのカードだけが乗った状態」が作れる
  if (opts.preCards) {
    for (const [cid, n] of Object.entries(opts.preCards)) {
      for (let i = 0; i < n; i++) { run.cards[cid] = (run.cards[cid] || 0) + 1; Game.applyCard(cid, run); }
    }
  }
  let t = 0, res = null;
  const offers = [];
  let cardsTaken = 0;
  const coins0 = Game.meta.coins;

  const waves = [];
  let wT = 0, wDealt = 0, wKills = 0, wCoins = Game.meta.coins;
  let wLeak = 0, wLost = 0, wCards = 0;
  const snapWave = (cleared) => {
    const g = globalWave(run.stageIdx, run.wave);
    const stageMul = Math.pow(BAL.stageHpMul, run.stageIdx);
    const hp1 = BAL.enemyHpBase * Math.pow(BAL.enemyHpGrowth, g - 1) * stageMul;
    const n = Combat.waveCount(run);
    // 上限に当たっていなければ何体だったか。当たると敵の増加がHPだけになる
    const nRaw = Math.floor((BAL.waveCountBase + g * BAL.waveCountPerWave) * run.mods.spawn);
    // 湧き切るまでに必ずかかる時間。ウェーブの長さのうち、これは戦闘ではなく待ち時間
    // **本体と同じ式を使う。** ここに式を写すと必ず片方だけ古くなる
    const spawnSec = Combat.spawnSecFor(n);
    const sec = (t - wT) / 60;
    const dealt = run.dealt - wDealt;
    const coins = Game.meta.coins - wCoins;
    const kills = run.kills - wKills;
    // **参考値。挙動には効いていない**（本体の e.dmg はどこからも読まれていない）。
    //   これを「敵の強さ」として読むと誤る
    const enemyDps = BAL.enemyDpsBase * Math.pow(BAL.enemyDpsGrowth, g - 1);
    waves.push({
      build: opts.buildId || '', stage: STAGE_BY_ID[run.stageId].name, wave: run.wave, g,
      elapsed: +(t / 60).toFixed(1),
      enemyHp: hp1, count: n, countRaw: nRaw, capped: nRaw > n,
      totalHp: hp1 * n, enemyDps,
      spawnSec, sec,
      killSec: dealt > 0 ? (hp1 * n) / (dealt / Math.max(0.001, sec)) : 0,
      dps: sec > 0 ? dealt / sec : 0,
      kills, leaked: run.leaked - wLeak, livesLost: run.livesLost - wLost,
      coins, cards: cardsTaken - wCards,
      units: run.units.length,
      coinRate: sec > 0 ? coins / sec : 0,
      killRate: sec > 0 ? kills / sec : 0,
      cleared,
    });
    wT = t; wDealt = run.dealt; wKills = run.kills; wCoins = Game.meta.coins;
    wLeak = run.leaked; wLost = run.livesLost; wCards = cardsTaken;
  };

  // **打ち切りは「負け」ではない。** ウェーブが長くなると1ステージが
  // この時間を超え、倒せているのに res が付かないまま抜けてしまう。
  // それを失敗と数えると、同じステージを何度もやり直して測定が止まる
  // ゲーム内の上限。**1章は5ウェーブ＝およそ2分**なので、
  //   20分も回す意味がない。長く取ると、詰まっている出撃1回に
  //   実時間で数十秒かかり、30章の測定が帰ってこなくなる（実測）。
  //   6分で決着が付かないなら、それは実質的に負け
  const TIME_CAP = 60 * 60 * TIME_MIN;
  // **実時間の上限も置く。**
  //   ゲーム内20分ぶんを回すのに、敵200体だと実時間で数分かかる。
  //   30章を測ろうとしたら1回の出撃が帰ってこなくなった（実測）。
  //   測定器が止まると何も分からないので、実時間でも打ち切る
  const REAL_CAP = (typeof REAL_MS === 'number') ? REAL_MS : 4000;
  const realT0 = performance.now();
  while (t < TIME_CAP) {
    if ((t & 255) === 0 && performance.now() - realT0 > REAL_CAP) { res = 'slow'; snapWave(false); break; }
    const sig = Combat.update(run, 1 / 60);
    t++;
    if (sig === 'dead') { res = 'dead'; snapWave(false); break; }
    if (sig === 'stageclear') { res = 'clear'; snapWave(true); break; }
    let justCleared = false;
    if (sig === 'waveclear') {
      snapWave(true);
      run.lives = Math.min(run.livesMax, run.lives + run.mods.regen);
      run.pendingPicks += run.mods.picks;
      Game.startNextWave();          // 本体はボタン待ちだが、計測では即続行する
      justCleared = true;
    }
    while (run.pendingPicks > 0) {
      if (opts.noDraft) { run.pendingPicks = 0; break; }
      const p = UI.rollDraft(run.mods.choices);
      run.pendingPicks--;
      if (!p.length) break;
      offers.push(p.length);
      p.sort((a, b) => BAL.rarityOrder.indexOf(CARDS[b].rarity) - BAL.rarityOrder.indexOf(CARDS[a].rarity));
      const id = p[0];
      run.cards[id] = (run.cards[id] || 0) + 1;
      cardsTaken++;
      Game.applyCard(id, run);
    }
    // ウェーブを凌いだら置き直す。**カードを引いたあと**＝本体と同じ順番
    if (justCleared && REPLACE_MODE && !run.over) replaceUnits(run);
  }
  if (!res) res = 'timeout';

  // 死因。**「負けた」で終わらせず、何に抜けられて終わったのかまで残す**
  let death = null;
  if (res === 'dead') {
    const by = Object.keys(run.leakBy).map(k => k + '×' + run.leakBy[k]).join(' ');
    const last = waves[waves.length - 1];
    death = {
      stage: STAGE_BY_ID[run.stageId].name, wave: run.wave,
      g: last ? last.g : 0,
      leakedBy: by,
      // そのウェーブで倒し切るのに要る秒数と、実際にかけられた秒数
      needSec: last && last.dps > 0 ? +(last.totalHp / last.dps).toFixed(1) : null,
      hadSec: last ? +last.sec.toFixed(1) : null,
      dps: last ? Math.round(last.dps) : 0,
      totalHp: last ? Math.round(last.totalHp) : 0,
    };
  }

  const sec = t / 60;
  const earned = (Game.meta.coins - coins0) + 0;  // 戦闘中に増えた分
  const out = {
    build: opts.buildId || '', stage: stageId, res, wave: run.wave,
    sec: +sec.toFixed(1),
    kills: run.kills, leaked: run.leaked, livesLost: run.livesLost,
    livesLeft: Math.max(0, Math.ceil(run.lives)), livesMax: run.livesMax,
    coinsEarned: Math.round(earned), coinsSpent: Math.round(spent), skillsBought: bought,
    cardsTaken, units: run.units.length, weapons: loadout.length,
    coinPerSec: +(earned / sec).toFixed(1),
    killPerSec: +(run.kills / sec).toFixed(1),
    dpsAvg: Math.round(run.dealt / sec),
    death, offers, waves,
    // 「シナジーが弱い」のか「シナジーのカードが来ていない」のかを分けるため、
    // 実際に取れたカードと、その編成で出るはずのシナジーを両方残す
    // どの幅で戦ったのか。近似の予測が当たっているかを見るのに要る
    arcMode: ARC_MODE, replace: REPLACE_MODE,
    arcAvg: run.units.length ? +(run.units.reduce((a,u)=>a+u.arc,0)/run.units.length).toFixed(3) : 0,
    groupAvg: run.units.length ? +(run.units.reduce((a,u)=>a+Game.groupingOf(u),0)/run.units.length).toFixed(3) : 0,
    cards: Object.assign({}, run.cards),
    synOwned: Object.keys(run.cards).filter(id => CARDS[id].kind === 'synergy'),
    synPossible: CARD_IDS.filter(id => CARDS[id].kind === 'synergy' &&
      CARDS[id].requires.every(w => loadout.indexOf(w) >= 0)),
  };
  Game.endRun(res === 'clear');
  return out;
}

// ---------------------------------------------------------------
// **パックを開ける。**
//
// 本体ではパックを開けるのはUIの操作なので、測定器は今まで1つも開けていなかった。
// つまり手札は STARTER_CARDS（ガトリングとスナイパーの強化＋汎用1枚）に
// 固定されたままで、**カード構築というこのゲームの柱が測定に入っていなかった。**
// 実際、シナジーカードは2000回抽選して0回しか出なかった。
// プレイヤーは貰ったパックを必ず開けるので、測定器も同じことをする
// ---------------------------------------------------------------
function openAllPacks() {
  const luck = Skill.mods(Game.meta, Game.perm).packLuck;
  let opened = 0, got = 0;
  for (let guard = 0; guard < 500; guard++) {
    const pid = PACK_IDS.find(k => (Game.perm.packs[k] || 0) > 0 && Pack.isUnlocked(Game.perm, k));
    if (!pid) break;
    Game.perm.packs[pid]--;
    for (const id of Pack.open(pid, luck)) { Game.grant(id, 1); got++; }
    opened++;
  }
  return { opened, got };
}

// ---------------------------------------------------------------
// 経済の測定（2026-09-19 追加）
//
// 「強い/弱い」ではなく「どこで経済曲線が壊れているか」を見るための一式。
// 調整前後・敵誘引あり無し・ビルド別を、**同じコードで**回して比べる
// ---------------------------------------------------------------


// 1周（突破できるところまで）。pick はステージを受けて編成を返す
function campaignRun(pick, opts) {
  opts = opts || {};
  if (opts.reset !== false) Game.newSave();
  const stages = [], allWaves = [], deaths = [];
  let total = 0, cleared = 0, attempts = 0, packsOpened = 0;
  for (const stg of MAIN_STAGES) {
    // **スキップできる章はスキップする**（本体のボタンと同じ条件・同じ報酬）
    if (opts.useSkip !== false && Game.canSkip(stg.id)) {
      Game.skipStage(stg.id);
      stages.push({ stage: stg.name, ok: true, tries: 0, sec: 0, note: 'スキップ' });
      cleared++;
      if (opts.stopAfter && cleared >= opts.stopAfter) break;
      continue;
    }
    let ok = false, tries = 0, secs = 0, note = '';
    for (let i = 1; i <= HARD_CAP; i++) {
      // プレイヤーと同じように、持っているパックは開けてから出撃する
      if (opts.noPacks !== true) packsOpened += openAllPacks().opened;
      const r = runStage(stg.id, pick(stg), 90, opts);
      tries = i; attempts++; secs += r.sec; total += r.sec;
      for (const w of r.waves) allWaves.push(w);
      if (r.death) deaths.push(r.death);
      if (r.res === 'clear') { ok = true; cleared++; break; }
      if (r.res === 'timeout' || r.res === 'slow') { note = '打切'; break; }
    }
    stages.push({ stage: stg.name, ok, tries, sec: +secs.toFixed(1), note });
    if (!ok) break;
    if (opts.stopAfter && cleared >= opts.stopAfter) break;
  }
  const m = Skill.mods(Game.meta, Game.perm);
  return {
    label: opts.label || '', stages, cleared, attempts, packsOpened,
    collection: Object.keys(Game.perm.collection).length,
    synOwned: CARD_IDS.filter(id => CARDS[id].kind === 'synergy' && Game.own(id) > 0),
    totalSec: +total.toFixed(1), totalMin: +(total / 60).toFixed(1),
    allWaves, deaths,
    coins: Math.round(Game.meta.coins),
    lv: SKILLS.reduce((a, x) => a + Skill.lv(Game.meta, x.id), 0),
    lureLv: Skill.gsum(Game.meta, 'lure'),
    mid: +m.cat.mid.dmg.toFixed(1), long: +m.cat.long.dmg.toFixed(1),
  };
}

// ウェーブ群をまとめる。**平均ではなく合計と比で見る**
function digest(waves) {
  if (!waves.length) return null;
  const sum = (f) => waves.reduce((a, w) => a + f(w), 0);
  const sec = sum(w => w.sec);
  const spawn = sum(w => Math.min(w.spawnSec, w.sec));   // 湧きは実時間を超えない
  return {
    waves: waves.length,
    sec: +sec.toFixed(1),
    spawnSec: +spawn.toFixed(1),
    // ウェーブ時間のうち、敵を待っているだけだった割合
    waitPct: +(100 * spawn / sec).toFixed(0),
    kills: sum(w => w.kills),
    coins: Math.round(sum(w => w.coins)),
    coinPerSec: +(sum(w => w.coins) / sec).toFixed(1),
    killPerSec: +(sum(w => w.kills) / sec).toFixed(1),
    livesLost: sum(w => w.livesLost),
    wavePerMin: +(60 * waves.length / sec).toFixed(2),
  };
}

// **マップ構造の差。**
//
// ステージが進むと敵HPが上がるのは当たり前として、
// 「マップが変わることでプレイヤーの配置判断が変わっているか」を数字にする。
// タワーディフェンスなので、ここが同じなら「HP倍率違いの同じステージ」になってしまう
function mapShape(stageId) {
  const st = Stage.build(stageId);
  let ground = 0, path = 0;
  const gs = [];
  for (let r = 0; r < st.rows; r++) for (let c = 0; c < st.cols; c++) {
    if (st.buildable(c, r)) { ground++; gs.push({ c, r }); }
    else if (st.walkable(c, r)) path++;
  }
  // 十字砲火が組めるか：その地面から、60度以上ひらいた2方向に通路が見えるか
  const R = 6, A = Math.PI / 3;
  let cross = 0;
  const paths = [];
  for (let r = 0; r < st.rows; r++) for (let c = 0; c < st.cols; c++)
    if (st.walkable(c, r)) paths.push({ c, r });
  for (const g of gs) {
    const as = [];
    for (const q of paths) {
      const dc = q.c - g.c, dr = q.r - g.r;
      if (dc * dc + dr * dr <= R * R) as.push(Math.atan2(dr, dc));
    }
    let ok = false;
    for (let i = 0; i < as.length && !ok; i++)
      for (let j = i + 1; j < as.length; j++) {
        let d = Math.abs(as[i] - as[j]) % (2 * Math.PI);
        if (d > Math.PI) d = 2 * Math.PI - d;
        if (d >= A) { ok = true; break; }
      }
    if (ok) cross++;
  }
  // 経路が1本にまとまっているか、複数に分かれたままか。
  // 合流が遅いほど「1箇所を固める」が効かず、配置を分散させられる
  const shared = {};
  for (const route of st.routes) for (const idx of route) shared[idx] = (shared[idx] || 0) + 1;
  const overlap = Object.keys(shared).filter(k => shared[k] > 1).length;
  const routeTiles = Object.keys(shared).length;
  return {
    stage: STAGE_BY_ID[stageId].name,
    出現口: st.spawns.length,
    経路長: st.routeLens.slice().sort((a, b) => a - b),
    通路: path, 地面: ground,
    十字砲火が組める地面: cross,
    '十字砲火率%': Math.round(100 * cross / ground),
    経路タイル: routeTiles,
    '合流している割合%': routeTiles ? Math.round(100 * overlap / routeTiles) : 0,
  };
}

// **転生の評価。** 「何分で転生するのが正解」を先に決めず、
// 「今回のランで得た成長 ÷ かかった時間」を実測する。
//   stopAfter ステージ突破したら転生する、を2周やって比べる
function prestigeTest(stopAfter, opts) {
  opts = Object.assign({}, opts || {}, { stopAfter });
  Game.newSave();
  const a = campaignRun(s => LOADOUTS[s.id], Object.assign({}, opts, { label: '1周目' }));
  if (!Game.canPrestige()) return { stopAfter, error: '転生条件を満たさなかった', a };
  const got = Game.prestige();
  const b = campaignRun(s => LOADOUTS[s.id],
    Object.assign({}, opts, { reset: false, label: '2周目（転生後）' }));
  return {
    stopAfter,
    packs: got.reward, prestiges: got.prestiges,
    aMin: a.totalMin, bMin: b.totalMin,
    speedup: a.totalSec > 0 ? +(a.totalSec / Math.max(1, b.totalSec)).toFixed(2) : null,
    aCleared: a.cleared, bCleared: b.cleared,
    a, b,
  };
}

// 1周分。**突破するまで回す。**
// 途中で見切りをつけると「実際には周回して貯まるコイン」が計算に入らず、
// 到達時の戦力を実際より低く見積もってしまう
const HARD_CAP = 15;           // 安全弁。これを超えたら「未突破」として扱う
                               // （上限無しにすると計算量が跳ね上がってブラウザが固まる）

function campaign() {
  Game.newSave();              // localStorage は触らない
  const rows = [];
  for (const st of MAIN_STAGES) {
    const lo = LOADOUTS[st.id];
    let cleared = null;
    const log = [];
    for (let i = 1; i <= HARD_CAP; i++) {
      const r = runStage(st.id, lo, 90);
      log.push(r);
      if (r.res === 'clear') { cleared = i; break; }
      if (r.res === 'timeout' || r.res === 'slow') break;   // 難易度ではなく長さの問題
    }
    // **突破できたときだけ**戦力を記録する。
    // 打ち切りで終わった回の値を混ぜると「突破時点の戦力」ではなくなる
    const m = Skill.mods(Game.meta, Game.perm);
    rows.push({ st, cleared, log,
      power: cleared ? {
        lv: SKILLS.reduce((a, x) => a + Skill.lv(Game.meta, x.id), 0),
        mid: +m.cat.mid.dmg.toFixed(1), long: +m.cat.long.dmg.toFixed(1),
        units: Skill.gsum(Game.meta, 'units'), lives: BAL.livesBase + m.lives,
      } : null });
    if (!cleared) break;
  }
  return rows;
}

// **複数回まわして中央値を取る。** カード抽選が乱数なので1本では当てにならない。
// 実際、同じ設定で「2回目突破」と「8回かけても未突破」が出たことがある
function campaignN(trials) {
  const per = STAGES.map(() => []);
  const power = STAGES.map(() => []);
  for (let t = 0; t < trials; t++) {
    const rows = campaign();
    rows.forEach((r, i) => {
      per[i].push(r.cleared || null);
      if (r.power && r.cleared) power[i].push(r.power);
    });
  }
  const med = (arr) => {
    const v = arr.filter(x => x !== null).sort((a, b) => a - b);
    if (!v.length) return null;
    return v[Math.floor(v.length / 2)];
  };
  // 戦力は数値の集まりなので、周回ぶんの**平均**を取る。
  // 並べ替えずに真ん中を拾うと、ただ「最後の周の値」を採っているだけになる
  const avg = (list) => {
    if (!list.length) return null;
    const keys = Object.keys(list[0]);
    const o = {};
    for (const k of keys) {
      const v = list.reduce((a, x) => a + x[k], 0) / list.length;
      o[k] = k === 'lv' || k === 'units' || k === 'lives' ? Math.round(v) : +v.toFixed(1);
    }
    return o;
  };
  return STAGES.map((st, i) => ({
    st, tries: per[i], median: med(per[i]), fails: per[i].filter(x => x === null).length,
    power: avg(power[i]),
  }));
}

document.getElementById('run').addEventListener('click', () => {
  const st = document.getElementById('status');
  const trials = Math.max(1, parseInt(document.getElementById('trials').value, 10) || 3);
  st.textContent = '計測中…（' + trials + '周ぶん。時間がかかります）';
  setTimeout(() => {
    const t0 = performance.now();
    const rows = campaignN(trials);
    const ms = Math.round(performance.now() - t0);
    let html = '<table><tr><th>ステージ</th><th>突破までの回数<br>（中央値）</th><th>各周の結果</th>' +
      '<th>突破時点の戦力<br>（総段数 / 中射程 / 長射程 / 増設 / ライフ）</th></tr>';
    for (const r of rows) {
      const list = r.tries.map(x => x === null ? '未突破' : x + '回').join(' , ');
      const p = r.power;
      html += '<tr><td>' + r.st.name + '</td>' +
        '<td class="' + (r.median ? 'ok' : 'ng') + '">' + (r.median ? r.median + '回目' : '未突破') + '</td>' +
        '<td>' + list + '</td>' +
        '<td>' + (p ? p.lv + ' / ×' + p.mid + ' / ×' + p.long + ' / ' + p.units + ' / ' + p.lives : '-') + '</td></tr>';
    }
    html += '</table>';
    html += '<p class="note">' + trials + '周の中央値。突破するまで回している（安全弁 ' + HARD_CAP + '回）。' +
      '「突破時点の戦力」は、そのステージを抜けた直後のアップグレードの効き具合（周回ぶんの平均）。' +
      '奥へ行くほど大きくなるなら、蓄積が難度を上回っているということ。' +
      '　／　計測にかかった時間 ' + ms + 'ms</p>';
    document.getElementById('out').innerHTML = html;
    st.textContent = '完了';
  }, 30);
});

// ---------------------------------------------------------------
// 成長曲線（方針17：抽象論ではなく数値を観測する）
//   プレイヤー側と敵側が、ウェーブごとにどう伸びているかを並べる。
//   絶対値ではなく「敵の総HP ÷ プレイヤーDPS = 倒しきるのに要る秒数」で見る
// ---------------------------------------------------------------
function curveRun(builds) {
  Game.newSave();
  const all = [];
  for (const st of MAIN_STAGES) {
    const lo = builds[st.id] || LOADOUTS[st.id];
    let r = null;
    for (let i = 1; i <= HARD_CAP; i++) {
      r = runStage(st.id, lo, 90);
      if (r.res === 'clear') break;
    }
    all.push(...r.waves);
    if (r.res !== 'clear') break;
  }
  return all;
}

document.getElementById('runCurve').addEventListener('click', () => {
  const st = document.getElementById('status');
  st.textContent = '計測中…';
  setTimeout(() => {
    const rows = curveRun({});
    let html = '<table><tr><th>ステージ</th><th>W</th><th>通算</th>' +
      '<th>敵1体HP</th><th>敵数<br>（上限前）</th><th>敵の総HP</th>' +
      '<th>実測DPS</th><th>総HP/DPS<br>（削る秒数）</th>' +
      '<th>湧き切る秒数</th><th>実際の秒数</th>' +
      '<th>漏れ</th><th>コイン/秒</th></tr>';
    for (const w of rows) {
      const need = w.dps > 0 ? (w.totalHp / w.dps) : Infinity;
      const tight = need > w.sec * 0.9;
      html += '<tr' + (w.cleared ? '' : ' class="ng"') + '><td>' + w.stage + '</td><td class="n">' + w.wave + '</td>' +
        '<td class="n">' + w.g + '</td>' +
        '<td class="n">' + Util.fmt(w.enemyHp) + '</td>' +
        '<td class="n' + (w.capped ? ' ng' : '') + '">' + w.count +
          (w.capped ? '<br><small>(' + w.countRaw + ')</small>' : '') + '</td>' +
        '<td class="n">' + Util.fmt(w.totalHp) + '</td>' +
        '<td class="n">' + Util.fmt(w.dps) + '</td>' +
        '<td class="n' + (tight ? ' ng' : ' ok') + '">' + (isFinite(need) ? need.toFixed(1) : '-') + 's</td>' +
        '<td class="n' + (w.spawnSec > need ? ' ng' : '') + '">' + w.spawnSec.toFixed(1) + 's</td>' +
        '<td class="n">' + w.sec.toFixed(1) + 's</td>' +
        '<td class="n">' + w.leaked + '</td>' +
        '<td class="n">' + Util.fmt(w.coinRate) + '</td></tr>';
    }
    html += '</table>';
    html += '<p class="note">「削る秒数」が「実際の秒数」を上回っていると、そのウェーブは倒し切れずに漏れている。' +
      '赤い行はそのランで撃沈したウェーブ。<br>' +
      '<b>絶対値ではなく比で読む。</b>敵HPもDPSも桁が増えていくのは正常で、' +
      '見るべきは「削る秒数」が時間とともにどう動いているか。<br>' +
      '<b>敵数が赤いのは上限600に張り付いている印</b>（括弧内が上限が無ければ出たはずの数）。' +
      'ここから先、敵の増加はHPだけになる。<br>' +
      '<b>「湧き切る秒数」が赤いのは、削るより湧かせるほうが遅いということ。</b>' +
      'その帯は敵が湧いた端から溶けるので、長さだけが増えて難しくはならない。</p>';
    document.getElementById('out').innerHTML = html;
    st.textContent = '完了';
  }, 30);
});

// ---------------------------------------------------------------
// ビルド差（方針11：標準／強力／非効率 の複数ケースで測る）
// ---------------------------------------------------------------
// **同じ4種を並べ替えただけのものを別ビルドとして数えない。**
// 以前の「強力」は「標準」と武器が完全に同じで、順番が違うだけだった。
// 配置は射程順に決まるので、2行は同じものを2回測っていた。
// 「非効率」も katana/tesla の2種しか無く、「射程が短い」と
// 「武器の種類が少ない」が混ざっていた
const BUILD_SETS = {
  // 短・中・長を散らした素直な編成
  '標準（射程を散らす）': ['gatling', 'sniper', 'missile', 'tesla'],
  // 触手＋ミサイル(伝説) / 触手＋迫撃砲(叙事詩) / ミサイル＋テスラ(叙事詩) が同時に狙える
  '強力（シナジー狙い）': ['tentacle', 'missile', 'mortar', 'tesla'],
  // 火炎＋毒ガス(爆燃)。面で焼く編成
  '範囲・支援寄り': ['flame', 'gas', 'cryo', 'mortar'],
  // 4種すべて射程165以下。種類は4つあるので「射程の短さ」だけを見られる
  '非効率（短射程だけ）': ['katana', 'flame', 'tentacle', 'cryo'],
};

document.getElementById('runBuilds').addEventListener('click', () => {
  const st = document.getElementById('status');
  st.textContent = '計測中…';
  setTimeout(() => {
    let html = '<table><tr><th>ビルド</th><th>到達</th><th>各ステージの突破回数</th>' +
      '<th>最終到達時の戦力<br>（総段数 / 中射程 / 長射程）</th></tr>';
    for (const name in BUILD_SETS) {
      const set = BUILD_SETS[name];
      Game.newSave();
      const tries = [];
      let reached = 0;
      for (const stg of MAIN_STAGES) {
        let ok = false;
        let why = '未突破';
        for (let i = 1; i <= HARD_CAP; i++) {
          const r = runStage(stg.id, set, 90);
          if (r.res === 'clear') { tries.push(i + '回'); ok = true; reached++; break; }
          if (r.res === 'timeout') { why = '打ち切り(20分超)'; break; }
        }
        if (!ok) { tries.push(why); break; }
      }
      const m = Skill.mods(Game.meta, Game.perm);
      const lv = SKILLS.reduce((a, x) => a + Skill.lv(Game.meta, x.id), 0);
      html += '<tr><td>' + name + '</td>' +
        '<td class="' + (reached === MAIN_STAGES.length ? 'ok' : 'ng') + '">' + reached + ' / ' + MAIN_STAGES.length + '</td>' +
        '<td>' + tries.join(' , ') + '</td>' +
        '<td>' + lv + ' / ×' + m.cat.mid.dmg.toFixed(1) + ' / ×' + m.cat.long.dmg.toFixed(1) + '</td></tr>';
    }
    html += '</table><p class="note">同じ編成を全ステージで通したときの到達段階。' +
      '強いビルドと弱いビルドで、どこで止まるかが変わるかを見る。<br>' +
      '<b>差が出ないなら、ビルドを考える意味が無いということ。</b></p>';
    document.getElementById('out').innerHTML = html;
    st.textContent = '完了';
  }, 30);
});

// カード枯渇の確認だけを単体で測る
document.getElementById('runCards').addEventListener('click', () => {
  const st = document.getElementById('status');
  st.textContent = '計測中…';
  setTimeout(() => {
    const lines = [];
    for (const picks of [0, 1, 2, 3]) {
      Game.newSave();
      Game.meta.skills.picks = picks;
      Game.perm.loadout = ['wc_gatling', 'wc_sniper', null, null];
      const rp = Game.startPrep('ch1');
      autoPlace(rp);
      Game.beginBattle();
      const run = Game.run;
      const sizes = [];
      const taken = {};
      for (let w = 0; w < BAL.wavesPerStage - 1; w++) {
        for (let k = 0; k < run.mods.picks; k++) {
          const p = UI.rollDraft(run.mods.choices);
          sizes.push(p.length);
          if (!p.length) continue;
          const id = p[0];
          run.cards[id] = (run.cards[id] || 0) + 1;
          taken[id] = (taken[id] || 0) + 1;
        }
      }
      Game.endRun(false);
      lines.push('増設スロット Lv' + picks + '（1ウェーブ ' + (picks + 1) + '枚）：' +
        '提示枚数 ' + sizes.join(',') + '　→ 空振り ' + sizes.filter(x => x === 0).length + '回');
    }
    document.getElementById('out').innerHTML = '<pre>' + lines.join('\n') + '</pre>' +
      '<p class="note">初期所持（カード7種）だけの状態で、1ステージぶんの抽選を回したもの。' +
      '0 が出ると「候補が尽きて選べなかった」という意味。</p>';
    st.textContent = '完了';
  }, 30);
});
